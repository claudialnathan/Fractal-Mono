name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install font tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes libharfbuzz-bin
          python -m pip install -r requirements.txt
      - name: Install browser tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Rebuild
        run: make build
      - name: Validate
        run: make test
