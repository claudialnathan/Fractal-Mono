name: Font checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: cp fonts/SHA256SUMS /tmp/fractal-committed
      - run: python build.py --check
      - run: diff /tmp/fractal-committed fonts/SHA256SUMS
      - name: Verify reproducible font exports
        run: |
          cp fonts/SHA256SUMS /tmp/fractal-first
          python build.py
          diff /tmp/fractal-first fonts/SHA256SUMS
